name: TikTok nature creator monitor

on:
  schedule:
    - cron: "2/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tiktok-nature-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check TikTok creators
        env:
          SERVER_CHAN_SENDKEY: ${{ secrets.SERVER_CHAN_SENDKEY }}
        run: node scripts/tiktok-monitor.mjs

      - name: Persist latest seen TikTok post IDs
        run: |
          if [[ -n "$(git status --porcelain data/tiktok-state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            cp data/tiktok-state.json /tmp/tiktok-state.json
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/tiktok-state.json data/tiktok-state.json

            git add data/tiktok-state.json
            git commit -m "Update TikTok monitor state"
            git push
          else
            echo "No TikTok state changes."
          fi
